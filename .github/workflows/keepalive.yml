name: Manter Supabase ativo

# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem uso.
# Este ping roda toda segunda e quarta e conta como uso.
on:
  schedule:
    - cron: "17 12 * * 1,3"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a função ping do banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Cadastre os secrets SUPABASE_URL e SUPABASE_KEY no repositório." >&2
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Resposta do Supabase: $code"
          [ "$code" = "200" ]
